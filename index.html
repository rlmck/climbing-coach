<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach — climbing training</title>
<meta name="description" content="Coach-prescribed finger strength and endurance training.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F6F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<!-- signed out, or still loading: the only thing on screen -->
<div class="authhost" id="authHost" hidden></div>

<div class="app" id="app" hidden>

  <!-- ───────────────────────── sidebar ───────────────────────── -->
  <aside class="rail" id="rail">
    <div class="rail__brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 20.5 9.2 6.2a1 1 0 0 1 1.83-.02L14 12.5l2.1-3.8a1 1 0 0 1 1.78.05L21 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="rail__wordmark">Coach</span>
    </div>

    <nav class="rail__nav" id="railNav" aria-label="Main"></nav>

    <div class="rail__log">
      <p class="eyebrow eyebrow--rail">Quick log</p>
      <button class="quick" data-log="strength"><span class="quick__dot quick__dot--s"></span>Strength</button>
      <button class="quick" data-log="endurance"><span class="quick__dot quick__dot--e"></span>Endurance</button>
      <button class="quick" data-log="pe"><span class="quick__dot quick__dot--p"></span>Power Endurance</button>
    </div>

    <div class="rail__foot">
      <p class="eyebrow eyebrow--rail">Viewing as</p>
      <div class="switcher" id="switcher" role="group" aria-label="Switch user"></div>
      <!-- only true in mock mode; app.js hides it against a real backend -->
      <p class="rail__note" id="mockNote" hidden>Prototype — mock data, nothing is saved.</p>
      <!-- which build this device is actually running, straight from the
           service worker that is serving it -->
      <p class="rail__note" id="buildNote" hidden></p>
    </div>
  </aside>

  <!-- ───────────────────────── main ───────────────────────── -->
  <main class="main" id="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- phone navigation: hidden at desktop widths -->
<nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>
<div class="rail-scrim" id="railScrim" hidden></div>

<!-- sheet host -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet-host" id="sheetHost" hidden role="dialog" aria-modal="true" aria-label="Log a session"></div>

<!-- toast host -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/Draggable.min.js"></script>
<script src="vendor/Flip.min.js"></script>

<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<!-- before data.js: the mock world is built through this parser too -->
<script src="js/cftest.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/repo.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/views/signin.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/progress.js"></script>
<script src="js/views/coach.js"></script>
<script src="js/views/invite.js"></script>
<script src="js/logs/strength.js"></script>
<script src="js/logs/session.js"></script>
<!-- before onboard.js: it builds its load fields with CT.loadPicker -->
<script src="js/logs/loads.js"></script>
<script src="js/logs/onboard.js"></script>
<script src="js/logs/cfupload.js"></script>
<script src="js/app.js"></script>

<script>
  /* Service workers need a real origin — skip it when opened from file:// */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    /* Whether this page was already under a worker when it loaded, read
       now because registering is about to change the answer. It decides
       whether a later handover is a first install or a new build. */
    const hadController = !!navigator.serviceWorker.controller;

    addEventListener('load', () => {
      /* `updateViaCache: 'none'` so the browser never answers the update
         check out of its own HTTP cache. sw.js is the one request that
         must always reach the server, because it is what decides whether
         everything else is stale. */
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        const check = () => reg.update().catch(() => {});
        check();
        /* An installed app is rarely reloaded and usually just resumed,
           so coming back to the foreground is the moment worth asking.
           It costs one conditional request for a 3 KB file. */
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      }).catch(() => {});

      /* A new worker has taken over, so this page is running code the
         worker no longer serves. Reload onto the new build — unless a
         sheet is open, because someone part-way through logging a
         session should not have it taken off them for an update they
         didn't ask for. That one lands on the next launch. */
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;         // first install: nothing to replace
        if (document.querySelector('#sheetHost .sheet')) return;
        reloading = true;
        location.reload();
      });
    });
  }
</script>
</body>
</html>
